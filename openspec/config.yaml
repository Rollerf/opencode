schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

context: |
  OpenSpec artifacts must be written in English, regardless of the user's conversation language, so requirements remain portable and token-efficient across projects.
  Every OpenSpec-backed change must define implementation-ready hard specs before coding starts. Hard specs resolve critical ambiguity, use deterministic requirements and scenarios, and include concrete tasks plus verification evidence.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

rules:
  proposal:
    - Write all prose in English.
    - Include goals, non-goals, scope boundaries, and open decisions needed to reach hard-spec readiness.
  design:
    - Write all prose in English.
    - Document chosen approach, trade-offs, and decisions needed to remove critical implementation ambiguity.
  specs:
    - Write all requirements, scenarios, acceptance criteria, and notes in English.
    - Define hard specs with observable SHALL requirements, deterministic WHEN/THEN scenarios, edge cases, and failure modes.
  tasks:
    - Write all task descriptions and verification commands in English.
    - Include concrete implementation and verification steps traceable to hard-spec requirements and scenarios.
    - Treat planning tasks as drafts until post-hard-spec task refinement sets the Task Refinement Gate to READY.
    - Give every incomplete implementation task a bounded outcome, requirement and scenario references, dependencies, execution-block ID, exact executor, exact targets and symbols, ordered steps, exact commands, expected evidence, and objective completion conditions.
    - Require RED, GREEN, and REFACTOR steps for behavior changes; use `TDD: Not applicable — <reason>` only for non-behavior tasks.
    - Group tasks into ordered executor-ready blocks with allowed targets, forbidden scope, stop conditions, exact block checks, and two to five cohesive tasks unless a single-task bootstrap, final-integration, or indivisible exception is justified.
    - Mark task refinement BLOCKED and return to spec hardening whenever implementation would require an unresolved product or technical decision.
