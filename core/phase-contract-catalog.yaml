version: 1
phases:
  - id: planning
    skill: openspec-planning
    path: skill/openspec-planning/SKILL.md
    entry_criteria:
      - One active change or an explicit request to open one.
      - The stack pack is resolved.
    completion_criteria:
      - Planning artifacts are consistent and written in English.
      - No unresolved critical implementation ambiguity remains.
      - When task refinement is requested, every incomplete task belongs to a valid executor-ready block and the Task Refinement Gate is READY.
  - id: spec-hardening
    skill: openspec-spec-hardening
    path: skill/openspec-spec-hardening/SKILL.md
    entry_criteria:
      - Drafted OpenSpec artifacts exist.
      - The stack pack is resolved.
    completion_criteria:
      - Critical ambiguity is resolved through operator decisions.
      - Strict OpenSpec validation passes.
  - id: implementation
    skill: openspec-implementation
    path: skill/openspec-implementation/SKILL.md
    entry_criteria:
      - The change has complete artifacts, strict validation, and no critical ambiguity.
      - The Task Refinement Gate is READY and remains valid after planning changes.
      - The stack pack is resolved.
    completion_criteria:
      - Completed tasks have implementation and verification evidence.
      - Behavior changes include RED, GREEN, and REFACTOR evidence.
  - id: verification
    skill: openspec-verification
    path: skill/openspec-verification/SKILL.md
    entry_criteria:
      - Implementation evidence exists.
      - The stack pack is resolved.
    completion_criteria:
      - Strict and pack-defined checks pass.
      - No critical verification finding remains.
  - id: archive
    skill: openspec-archive
    path: skill/openspec-archive/SKILL.md
    entry_criteria:
      - The change is complete and verified.
      - The stack pack is resolved.
    completion_criteria:
      - The change is archived and specs are synchronized.
      - Post-archive validation passes.
