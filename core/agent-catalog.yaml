version: 2
agents:
  - id: orchestrator
    runtime_name: orchestrator
    path: agents/orchestrator.md
    phase_scope: cross-phase
    specialization: workflow-orchestration
    model: openai/gpt-5.6-sol
    steps: 40
    delegation_scope: Final decisions, phase execution, local edits, and bounded specialist delegation.
    expected_inputs:
      - user_goal
      - consumer_project
      - resolved_stack_pack
    expected_outputs:
      - completed_local_work
      - execution_evidence
      - blockers_and_decisions
  - id: code-documentation-subagent
    runtime_name: subagent/code-documentation-subagent
    path: agents/subagent/code-documentation-subagent.md
    phase_scope: cross-phase
    specialization: bounded-documentation-deliverable
    model: openai/gpt-5.6-luna
    steps: 10
    delegation_scope: Produce or update a distinct documentation deliverable from supplied code, contracts, pack, and scope.
    expected_inputs:
      - documentation_scope
      - relevant_files_and_contracts
      - resolved_stack_pack
    expected_outputs:
      - documentation_changes
      - validation_notes
  - id: design-doc-subagent
    runtime_name: subagent/design-doc-subagent
    path: agents/subagent/design-doc-subagent.md
    phase_scope: planning
    specialization: bounded-design-deliverable
    model: openai/gpt-5.6-luna
    steps: 12
    delegation_scope: Draft a standalone design document for orchestrator review without owning final decisions.
    expected_inputs:
      - design_problem
      - architecture_context
      - resolved_stack_pack
    expected_outputs:
      - design_document
      - open_decisions
  - id: refined-task-executor-subagent
    runtime_name: subagent/refined-task-executor-subagent
    path: agents/subagent/refined-task-executor-subagent.md
    phase_scope: implementation
    specialization: executor-ready-task-block-implementation
    model: openai/gpt-5.6-luna
    variant: high
    steps: 50
    delegation_scope: Execute exactly one executor-ready task block within declared targets without making product or technical decisions.
    expected_inputs:
      - execution_block_handoff
      - relevant_artifact_excerpts
      - resolved_stack_pack
    expected_outputs:
      - structured_block_result
      - changed_files
      - command_evidence
  - id: pulumi-infrastructure-subagent
    runtime_name: subagent/pulumi-infrastructure-subagent
    path: agents/subagent/pulumi-infrastructure-subagent.md
    phase_scope: implementation
    specialization: pulumi-infrastructure
    model: openai/gpt-5.6-sol
    steps: 20
    delegation_scope: Implement a bounded local Pulumi change without deployment or cloud mutation.
    expected_inputs:
      - infrastructure_scope
      - pulumi_project_context
      - resolved_stack_pack
    expected_outputs:
      - pulumi_changes
      - preview_or_validation_evidence
  - id: tdd-tests-subagent
    runtime_name: subagent/tdd-tests-subagent
    path: agents/subagent/tdd-tests-subagent.md
    phase_scope: implementation
    specialization: test-design-and-red-evidence
    model: openai/gpt-5.6-sol
    steps: 20
    delegation_scope: Own bounded test design and test edits; production code only when explicitly delegated.
    expected_inputs:
      - behavior_requirements
      - test_scope
      - resolved_stack_pack
    expected_outputs:
      - tests_and_requirement_mapping
      - red_green_refactor_evidence
