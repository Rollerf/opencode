version: 1
agents:
  - id: missing-helper
    runtime_name: missing-helper
    path: agents/missing-helper.md
    phase_scope: cross-phase
    specialization: fixture
    model: openai/gpt-5.6-luna
    steps: 1
    delegation_scope: none
    expected_inputs: [request]
    expected_outputs: [result]
  - id: orchestrator
    runtime_name: orchestrator
    path: agents/orchestrator.md
    phase_scope: cross-phase
    specialization: orchestration
    model: openai/gpt-5.6-sol
    steps: 40
    delegation_scope: bounded
    expected_inputs: [user_goal]
    expected_outputs: [phase_result]
